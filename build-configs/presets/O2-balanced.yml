name: O2-balanced
description: >
  Recommended default. Good balance of build speed, binary size, and
  runtime performance. Uses -O2 for compilation and -O3 for wasm-opt
  post-processing.

compilation:
  optimization: '-O2'
  lto: false
  exceptions: 'none'
  threading: 'single-threaded'

linking:
  yaml: '../full.yml'
  wasmOptLevel: '-O3'

optimizations:
  closure: false
  evalCtors: false
  converge: false
  patchDump: false

name: Os-minsize
description: >
  Smallest binary size. Uses -Os for compilation and -Oz for wasm-opt.
  Best for bandwidth-constrained deployments. Runtime performance is
  typically within 5-10% of -O2.

compilation:
  optimization: '-Os'
  lto: false
  exceptions: 'none'
  threading: 'single-threaded'
  defines: ['OCCT_NO_DUMP']
  undefines: ['OCC_CONVERT_SIGNALS']

linking:
  yaml: '../full.yml'
  wasmOptLevel: '-Oz'

optimizations:
  closure: true
  evalCtors: true
  converge: true
  patchDump: true

  class TopoDS_Cast {
  public:
    static TopoDS_Vertex Vertex(const TopoDS_Shape& S) { return TopoDS::Vertex(S); }
    static TopoDS_Edge Edge(const TopoDS_Shape& S) { return TopoDS::Edge(S); }
    static TopoDS_Wire Wire(const TopoDS_Shape& S) { return TopoDS::Wire(S); }
    static TopoDS_Face Face(const TopoDS_Shape& S) { return TopoDS::Face(S); }
    static TopoDS_Shell Shell(const TopoDS_Shape& S) { return TopoDS::Shell(S); }
    static TopoDS_Solid Solid(const TopoDS_Shape& S) { return TopoDS::Solid(S); }
    static TopoDS_Compound Compound(const TopoDS_Shape& S) { return TopoDS::Compound(S); }
    static TopoDS_CompSolid CompSolid(const TopoDS_Shape& S) { return TopoDS::CompSolid(S); }
  };

  class OCJS {
  public:
    static Standard_Failure* getStandard_FailureData(intptr_t exceptionPtr) {
      return reinterpret_cast<Standard_Failure*>(exceptionPtr);
    }
  };

  class OCJS_ShapeHasher {
  public:
    static int HashCode(const TopoDS_Shape& shape, int upperBound) {
      if (upperBound <= 0) return 0;
      size_t h = std::hash<TopoDS_Shape>{}(shape);
      return static_cast<int>((h % static_cast<size_t>(upperBound)) + 1);
    }
  };

  class BRepMesh_IncrementalMeshWrapper {
  public:
    BRepMesh_IncrementalMeshWrapper(const TopoDS_Shape& theShape,
                                     const double theLinDeflection,
                                     const bool isRelative,
                                     const double theAngDeflection,
                                     const bool isInParallel) {
      mesh_ = new BRepMesh_IncrementalMesh(theShape, theLinDeflection, isRelative, theAngDeflection, isInParallel);
    }
    ~BRepMesh_IncrementalMeshWrapper() { delete mesh_; }
    bool IsDone() const { return mesh_->IsDone(); }
    bool IsModified() const { return mesh_->IsModified(); }
    int GetStatusFlags() const { return mesh_->GetStatusFlags(); }
  private:
    BRepMesh_IncrementalMesh* mesh_;
  };

  class BRepToolsWrapper {
  public:
    static std::string Write(const TopoDS_Shape& shape) {
      std::ostringstream oss(std::ios::binary);
      oss << std::setprecision(17);
      BRepTools::Write(shape, oss);
      return oss.str();
    }
    static TopoDS_Shape Read(const std::string& data) {
      std::istringstream iss(data, std::ios::binary);
      TopoDS_Shape shape;
      BRep_Builder builder;
      Message_ProgressRange progress;
      BRepTools::Read(shape, iss, builder, progress);
      return shape;
    }
  };

  class GeomToolsWrapper {
  public:
    static std::string Write(const Handle(Geom2d_Curve)& geometry) {
      std::ostringstream oss(std::ios::binary);
      oss << std::setprecision(17);
      GeomTools::Write(geometry, oss);
      return oss.str();
    }
    static Handle(Geom2d_Curve) Read(const std::string& data) {
      std::istringstream iss(data, std::ios::binary);
      Handle(Geom2d_Curve) geometry;
      GeomTools::Read(geometry, iss);
      return geometry;
    }
  };

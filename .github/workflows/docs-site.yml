name: docs

on:
  push:
    branches: ['**']
    paths:
      - 'docs-site/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'project.json'
      - 'scripts/generate-docs.mjs'
      - 'scripts/lib/dts-parser.mjs'
      - 'scripts/lib/source-date-epoch.mjs'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'project.json'
      - 'scripts/generate-docs.mjs'
      - 'scripts/lib/dts-parser.mjs'
      - 'scripts/lib/source-date-epoch.mjs'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || format('docs-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ordinary:
    name: docs · ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, lint, test:unit]
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.script }}
        run: pnpm ${{ matrix.script }}

  vale:
    name: docs · prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Vale
        uses: vale-cli/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          version: 3.9.1
          files: docs-site/content/docs
          fail_on_error: true
          vale_flags: '--config=docs-site/.vale.ini'

  build:
    name: docs · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Verify generated llms.txt route
        run: |
          for path in .next/server/app/llms.txt.body .next/server/app/llms.txt/route.js; do
            if [ -e "$path" ]; then
              exit 0
            fi
          done
          echo "Could not find the generated llms.txt route" >&2
          exit 1
      - name: Upload build-dependent test inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs-site/.next
            docs-site/data/api-search-index.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  postbuild:
    name: docs · postbuild
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download build-dependent test inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs-site
      - name: Run post-build budgets
        run: pnpm test:postbuild

  docs-required:
    name: docs-required
    if: always()
    needs: [ordinary, vale, build, postbuild]
    runs-on: ubuntu-latest
    steps:
      - name: Require all docs evidence
        env:
          BUILD: ${{ needs.build.result }}
          ORDINARY: ${{ needs.ordinary.result }}
          POSTBUILD: ${{ needs.postbuild.result }}
          VALE: ${{ needs.vale.result }}
        run: |
          test "$BUILD" = success
          test "$ORDINARY" = success
          test "$POSTBUILD" = success
          test "$VALE" = success

name: docs-site

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site.yml'

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test --run

      - name: Vale anti-slop
        uses: errata-ai/vale-action@reviewdog
        with:
          version: 3.9.1
          files: docs-site/content/docs
          fail_on_error: true

      - name: Build
        run: pnpm build

      - name: Verify llms.txt was generated
        run: |
          set -euo pipefail
          for path in \
            .next/server/app/llms.txt.body \
            .next/server/app/llms.txt/route.js \
            ; do
            if [ -e "$path" ]; then
              echo "Found generated artifact: $path"
              exit 0
            fi
          done
          echo "Could not find llms.txt build output"
          ls -la .next/server/app || true
          exit 1

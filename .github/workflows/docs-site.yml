name: docs

on:
  push:
    branches: ['**']
    paths:
      - 'docs-site/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'project.json'
      - 'scripts/generate-docs.mjs'
      - 'scripts/lib/dts-parser.mjs'
      - 'scripts/lib/source-date-epoch.mjs'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'project.json'
      - 'scripts/generate-docs.mjs'
      - 'scripts/lib/dts-parser.mjs'
      - 'scripts/lib/source-date-epoch.mjs'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || format('docs-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ordinary:
    name: docs · ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, lint, test:unit]
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.script }}
        run: pnpm ${{ matrix.script }}

  vale:
    name: docs · prose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Vale
        uses: vale-cli/vale-action@d89dee975228ae261d22c15adcd03578634d429c # v2.1.1
        with:
          version: 3.9.1
          files: docs-site/content/docs
          fail_on_error: true
          vale_flags: '--config=docs-site/.vale.ini'

  build:
    name: docs · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Verify generated llms.txt route
        run: |
          for path in .next/server/app/llms.txt.body .next/server/app/llms.txt/route.js; do
            if [ -e "$path" ]; then
              exit 0
            fi
          done
          echo "Could not find the generated llms.txt route" >&2
          exit 1
      - name: Upload build-dependent test inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs-site/.next
            docs-site/data/api-search-index.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  postbuild:
    name: docs · postbuild
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download build-dependent test inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs-site
      - name: Run post-build budgets
        run: pnpm test:postbuild

  docs-required:
    name: docs-required
    if: always()
    needs: [ordinary, vale, build, postbuild]
    runs-on: ubuntu-latest
    steps:
      - name: Require all docs evidence
        env:
          BUILD: ${{ needs.build.result }}
          ORDINARY: ${{ needs.ordinary.result }}
          POSTBUILD: ${{ needs.postbuild.result }}
          VALE: ${{ needs.vale.result }}
        run: |
          test "$BUILD" = success
          test "$ORDINARY" = success
          test "$POSTBUILD" = success
          test "$VALE" = success

[project]
name = "ocjs-bindgen"
version = "0.0.0"
description = "OCJS bindgen — Python package that converts OCCT C++ headers into Embind C++ + TypeScript declarations."
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
# Phase 3 PR 3.1 — unit + integration test discovery.
#
# Layout:
#   tests/sentinel/    — byte-parity sentinels (pre-existing, layered cost).
#   tests/unit/        — fast hermetic unit tests on shared modules
#                        (mocked libclang cursors via conftest.cursor_mock()).
#   tests/integration/ — small per-fragment snapshot tests using a frozen
#                        OCCT input, <30 s wall clock.
testpaths = ["tests/sentinel", "tests/unit", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Quieter default output for the project sentinel suite which prints a lot
# of incidental Doxygen / build chatter on stdout.
addopts = ["-ra", "--strict-markers"]
markers = ["libclang: tests that require a real libclang + emsdk toolchain (vendored LLVM 17 + clone-deps.sh)"]
filterwarnings = [
  "error::DeprecationWarning",
  # ignore third-party deprecations we don't control
  "ignore:.*pkg_resources.*:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
  "deps/**",
  "build/**",
  "dist/**",
  "src/patches/**", # legacy formatting
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501", # line length handled by formatter / inline noqa
  "E741", # ambiguous one-letter names (used by clang AST visitors)
]

[tool.pyright]
include = ["src/ocjs_bindgen", "tests"]
exclude = ["**/__pycache__", "deps", "build", "dist"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportGeneralTypeIssues = "warning"
